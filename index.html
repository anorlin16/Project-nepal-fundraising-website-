<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Charity Project Nepal</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
}

/* HERO SECTION */
.hero {
    position: sticky;
    top: 0;
    height: 100vh;
    background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
    url('https://images.unsplash.com/photo-1544735716-392fe2489ffa');
    background-size: cover;
    background-position: center;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    transition: height 0.4s ease;
    z-index: 10;
}

.hero.shrink {
    height: 60vh;
}

.hero h1 {
    font-size: 4rem;
    margin: 0;
}

/* PRODUCTS SECTION */
.products {
    padding: 100px 40px;
    text-align: center;
    background: #ffffff;
}

.products h2 {
    font-size: 2.5rem;
    margin-bottom: 60px;
}

.product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 50px;
    max-width: 1200px;
    margin: auto;
}

.product {
    background: #fafafa;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    transition: transform 0.2s ease;
}

.product:hover {
    transform: translateY(-8px);
}

.product img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    border-radius: 12px;
}

.product p {
    font-size: 1.2rem;
    margin: 15px 0 5px 0;
}

.price {
    font-size: 1.3rem;
    font-weight: bold;
    color: #2e7d32;
}
</style>
</head>

<body>

<div class="hero" id="hero">
    <h1>Charity Project Nepal</h1>
</div>

<section class="products">
    <h2>Support Our Cause</h2>

    <div class="product-grid">

        <!-- PRODUCT 1 -->
        <div class="product">
            <img src="https://via.placeholder.com/400x300" alt="">
            <p>Product Name</p>
            <div class="price">$10</div>
        </div>

        <!-- PRODUCT 2 -->
        <div class="product">
            <img src="https://via.placeholder.com/400x300" alt="">
            <p>Product Name</p>
            <div class="price">$15</div>
        </div>

        <!-- PRODUCT 3 -->
        <div class="product">
            <img src="https://via.placeholder.com/400x300" alt="">
            <p>Product Name</p>
            <div class="price">$20</div>
        </div>

        <!-- PRODUCT 4 -->
        <div class="product">
            <img src="https://via.placeholder.com/400x300" alt="">
            <p>Product Name</p>
            <div class="price">$12</div>
        </div>

        <!-- PRODUCT 5 -->
        <div class="product">
            <img src="https://via.placeholder.com/400x300" alt="">
            <p>Product Name</p>
            <div class="price">$18</div>
        </div>

        <!-- PRODUCT 6 -->
        <div class="product">
            <img src="https://via.placeholder.com/400x300" alt="">
            <p>Product Name</p>
            <div class="price">$25</div>
        </div>

    </div>
</section>

<script>
window.addEventListener("scroll", function() {
    const hero = document.getElementById("hero");
    if (window.scrollY > 100) {
        hero.classList.add("shrink");
    } else {
        hero.classList.remove("shrink");
    }
});
</script>

</body>
</html>
